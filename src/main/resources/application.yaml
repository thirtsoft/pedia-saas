spring:
  application:
    name: pedia-saas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pediasaas}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    create-schemas: true
    schemas: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8098}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.wokite.net.pediasaas: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT24H}